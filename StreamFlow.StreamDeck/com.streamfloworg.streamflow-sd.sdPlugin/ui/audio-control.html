<!DOCTYPE html>
<html>

<head lang="en">
    <title>Audio Control Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #9f9f9f;
            background-color: #2d2d2d;
            font-size: 11px;
            margin: 0;
            padding: 10px;
        }
        .sdpi-heading {
            font-size: 11px;
            font-weight: bold;
            color: #e2e2e2;
            margin: 15px 0 10px 0;
            text-transform: uppercase;
            border-bottom: 1px solid #444;
            padding-bottom: 4px;
            letter-spacing: 0.5px;
        }
    </style>
</head>

<body>
    <!-- Global Settings Group -->
    <div class="sdpi-heading">Global Settings</div>
    <sdpi-item label="Host URL">
        <sdpi-textfield setting="hostUrl" global placeholder="http://localhost:8080" default="http://localhost:8080"></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="API Key">
        <sdpi-textfield setting="apiKey" global password placeholder="Enter API Key if required"></sdpi-textfield>
    </sdpi-item>

    <!-- Action Specific Settings -->
    <div class="sdpi-heading">Action Settings</div>
    <sdpi-item label="Action Type">
        <sdpi-select setting="actionType" default="mute">
            <option value="mute">Toggle Mute</option>
            <option value="volume">Adjust Volume</option>
        </sdpi-select>
    </sdpi-item>

    <sdpi-item label="Audio Source">
        <sdpi-textfield setting="source" placeholder="e.g. microphone, system, spotify" default="microphone"></sdpi-textfield>
    </sdpi-item>

    <sdpi-item label="Volume Action">
        <sdpi-select setting="volumeAction" default="set">
            <option value="set">Set Absolute Volume</option>
            <option value="increment">Increment (+)</option>
            <option value="decrement">Decrement (-)</option>
        </sdpi-select>
    </sdpi-item>

    <sdpi-item label="Volume Value">
        <sdpi-range setting="volumeValue" min="0" max="100" step="5" default="50" showlabels></sdpi-range>
    </sdpi-item>
</body>

</html>
