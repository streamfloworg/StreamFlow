<!DOCTYPE html>
<html>

<head lang="en">
    <title>Media Playback Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #9f9f9f;
            background-color: #2d2d2d;
            font-size: 11px;
            margin: 0;
            padding: 10px;
        }
        .sdpi-heading {
            font-size: 11px;
            font-weight: bold;
            color: #e2e2e2;
            margin: 15px 0 10px 0;
            text-transform: uppercase;
            border-bottom: 1px solid #444;
            padding-bottom: 4px;
            letter-spacing: 0.5px;
        }
    </style>
</head>

<body>
    <!-- Global Settings Group -->
    <div class="sdpi-heading">Global Settings</div>
    <sdpi-item label="Host URL">
        <sdpi-textfield setting="hostUrl" global placeholder="http://localhost:8080" default="http://localhost:8080"></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="API Key">
        <sdpi-textfield setting="apiKey" global password placeholder="Enter API Key if required"></sdpi-textfield>
    </sdpi-item>

    <!-- Action Specific Settings -->
    <div class="sdpi-heading">Action Settings</div>
    <sdpi-item label="Action Type">
        <sdpi-select setting="actionType" default="playback">
            <option value="playback">Playback Commands</option>
            <option value="spotify_uri">Play Spotify URI</option>
            <option value="local_file">Play Local Audio File (SFX)</option>
        </sdpi-select>
    </sdpi-item>

    <!-- Playback options -->
    <sdpi-item label="Command">
        <sdpi-select setting="playbackAction" default="toggle">
            <option value="toggle">Toggle Play/Pause</option>
            <option value="play">Force Play</option>
            <option value="pause">Force Pause</option>
            <option value="next">Next Track</option>
            <option value="prev">Previous Track</option>
        </sdpi-select>
    </sdpi-item>

    <sdpi-item label="Player Type">
        <sdpi-select setting="playbackPlayer" default="auto">
            <option value="auto">Auto Select</option>
            <option value="spotify">Spotify Only</option>
            <option value="local">Local Player Only</option>
        </sdpi-select>
    </sdpi-item>

    <!-- Spotify option -->
    <sdpi-item label="Spotify URI">
        <sdpi-textfield setting="spotifyUri" placeholder="spotify:playlist:... or URL"></sdpi-textfield>
    </sdpi-item>

    <!-- Local File options -->
    <sdpi-item label="File Path">
        <sdpi-textfield setting="localFilePath" placeholder="C:\Sounds\sound.wav"></sdpi-textfield>
    </sdpi-item>

    <sdpi-item label="SFX Volume">
        <sdpi-range setting="localFileVolume" min="0" max="100" step="5" default="100" showlabels></sdpi-range>
    </sdpi-item>
</body>

</html>
